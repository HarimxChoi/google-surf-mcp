<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100" role="img" aria-labelledby="diagram-title">
<title id="diagram-title">Google Surf MCP architecture</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6c8693"/></marker></defs>
<style>text{font-family:"Segoe UI","Malgun Gothic",Arial,sans-serif;text-anchor:middle;dominant-baseline:middle;letter-spacing:0;fill:#e8edf2}.title{font-size:22px;font-weight:650}.body{font-size:18px;fill:#b5cee4}.edge{font-size:14px;fill:#8cb5cb}.heading{font-size:34px;font-weight:700;text-anchor:start}.subtitle{font-size:19px;fill:#a9c9e3;text-anchor:start}.footer{font-size:17px;fill:#a9c9e3}</style>
<rect width="1400" height="1100" fill="#14191e"/>
<text x="80" y="43" class="heading">Google Surf MCP</text>
<text x="80" y="81" class="subtitle">Live discovery / source reading / local project knowledge</text>
<g fill="none" stroke="#405b67" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M700 218 V252 H260 V278" marker-end="url(#arrow)"/><path d="M700 218 V278" marker-end="url(#arrow)"/><path d="M700 252 H1140 V278" marker-end="url(#arrow)"/><path d="M260 390 V460" marker-end="url(#arrow)"/><path d="M700 390 V460" marker-end="url(#arrow)"/><path d="M1140 390 V460" marker-end="url(#arrow)"/><path d="M440 550 H508" marker-end="url(#arrow)"/><path d="M880 550 H948" stroke-dasharray="6 6" marker-end="url(#arrow)"/><path d="M260 628 V698" marker-end="url(#arrow)"/><path d="M1140 628 V698" marker-end="url(#arrow)"/><path d="M260 810 V872 H700 V910" marker-end="url(#arrow)"/><path d="M1140 832 V872 H700" marker-end="url(#arrow)"/><path d="M700 628 V910" marker-end="url(#arrow)"/></g><g id="client"><circle cx="700" cy="136" r="5" fill="#cbd7df"/><text x="700" y="158.5" class="title">Any MCP client</text><text x="700" y="183.5" class="body">Codex / Claude Code / Cursor / others</text></g><g id="web"><circle cx="260" cy="302" r="5" fill="#77dcea"/><text x="260" y="327.5" class="title">search / search_parallel</text><text x="260" y="352.5" class="body">Discover new web sources</text></g><g id="extract"><circle cx="700" cy="302" r="5" fill="#7fb491"/><text x="700" y="327.5" class="title">extract</text><text x="700" y="352.5" class="body">Read a known public URL</text></g><g id="local"><circle cx="1140" cy="302" r="5" fill="#ef907c"/><text x="1140" y="327.5" class="title">project_memory_search</text><text x="1140" y="352.5" class="body">Search stored project knowledge</text></g><g id="browser"><circle cx="260" cy="484" r="5" fill="#77dcea"/><text x="260" y="512.5" class="title">Chrome / Playwright</text><text x="260" y="537.5" class="body">Shared native browser broker</text><text x="260" y="562.5" class="body">Up to four reusable search tabs</text><text x="260" y="587.5" class="body">Human CAPTCHA handoff</text></g><g id="reader"><circle cx="700" cy="484" r="5" fill="#7fb491"/><text x="700" y="512.5" class="title">Source reader</text><text x="700" y="537.5" class="body">HTTP / isolated headless context</text><text x="700" y="562.5" class="body">LiteParse CPU OCR when enabled</text><text x="700" y="587.5" class="body">Xberg Office / native HWP</text></g><g id="store"><circle cx="1140" cy="484" r="5" fill="#ef907c"/><text x="1140" y="512.5" class="title">Local project store</text><text x="1140" y="537.5" class="body">SurrealDB / embedded RocksDB</text><text x="1140" y="562.5" class="body">Catalog / payloads / indexes</text><text x="1140" y="587.5" class="body">Typed graph and provenance</text></g><g id="webRank"><circle cx="260" cy="722" r="5" fill="#77dcea"/><text x="260" y="747.5" class="title">Lightweight web ranking</text><text x="260" y="772.5" class="body">Provider order + BM25 + RRF</text></g><g id="localRank"><circle cx="1140" cy="722" r="5" fill="#ef907c"/><text x="1140" y="746" class="title">Hybrid local retrieval</text><text x="1140" y="771" class="body">Exact / BM25 / E5 / Graph</text><text x="1140" y="796" class="body">RRF + cached E5 reranking</text></g><g id="evidence"><circle cx="700" cy="934" r="5" fill="#cbd7df"/><text x="700" y="963.5" class="title">Bounded, source-backed evidence</text><text x="700" y="988.5" class="body">Relevant passages / source references / follow-up reads</text></g><text x="480" y="537" class="edge">read</text><text x="920" y="537" class="edge">save*</text>
<text x="700" y="1070" class="footer">* Auto Ontology enabled. Live-only search does not open the project DB or load E5.</text>
</svg>