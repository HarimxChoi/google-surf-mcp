name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npx playwright install chromium
        if: runner.os == 'Windows'
      - run: npm run check:prereg
      - run: npm run build
      - run: npx tsc -p tsconfig.scripts.json --noEmit
      - run: npm run research:reopen-probe
      - run: npm run smoke:mcp
      - run: npm run research:memory-soak -- 100
      - run: npm run smoke:hooks
      - run: npm run smoke:extraction
      - run: npm test -- --maxWorkers=2
