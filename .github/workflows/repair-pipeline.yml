name: serp-repair-pipeline

# Triple Gate + 3-query empirical self-healing.
# Daily cron checks if Google SERP selectors broke and proposes draft PR.
# Auto-merge: NEVER. Always human review.

on:
  schedule:
    - cron: '17 3 * * *'   # 매일 03:17 UTC, 다른 cron과 충돌 방지
  workflow_dispatch: {}

jobs:
  detect-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SURF_LLM_HEAL: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: install deps
        run: npm ci

      - name: install playwright chromium
        run: npx playwright install --with-deps chromium

      - name: build
        run: npm run build

      - name: build repair scripts
        run: npx tsc -p tsconfig.scripts.json

      # bootstrap.js blocks 10 minutes waiting for a human to run a search.
      - name: bootstrap profile (unattended, headed via Xvfb)
        env:
          DISPLAY: ':99'
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1366x768x24 &
          sleep 2
          node build/bootstrap-auto.js || true

      - name: run repair pipeline
        id: repair
        run: node build-scripts/scripts/repair/index.js

      - name: report repair decision
        if: steps.repair.outputs.should_open_pr == 'true'
        run: |
          # The pipeline only proposes a selector; a human applies it to src/parse.ts.
          echo "Repair pipeline proposed a selector fix (caution=${{ steps.repair.outputs.caution }})."
          echo "Review the run artifacts and the drift issue, then patch src/parse.ts manually."

      # Datacenter IPs get /sorry/, so a blocked probe verified nothing.
      - name: fail on blocked probe
        if: steps.repair.outputs.trigger == 'blocked'
        run: |
          echo "::error::Repair probe was blocked by Google; selector drift was NOT checked this run."
          exit 1

      - name: open drift issue
        if: steps.repair.outputs.trigger == 'detected'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "SERP selector drift detected $(date +%Y-%m-%d)" \
            --body "Repair pipeline detected selector drift. Check workflow logs and the repair-report.json artifact." \
            --label "automated,parser-drift" || true

      - name: open infra failure issue
        if: failure() && steps.repair.outputs.trigger != 'detected'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "repair-pipeline infrastructure failure $(date +%Y-%m-%d)" \
            --body "The pipeline failed before or without reaching a drift verdict (trigger=${{ steps.repair.outputs.trigger }}). This is not a selector problem." \
            --label "automated,ci" || true

      - name: upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-run-${{ github.run_id }}
          path: |
            build-scripts/scripts/repair/repair-report.json
            *.log
          if-no-files-found: error
          retention-days: 30
